# socs/sc8280xp/soc.conf: what this SoC family is: the facts of a Qualcomm SC8280XP-family chip, whatever device it is in.
# A device with this SoC includes configs/sc8280xp.config from its defconfig. docs/porting/repositories.md has every word.

soc sc8280xp
	title       Qualcomm SC8280XP family (SM8475 "Snapdragon 8cx Gen 3", SC8280XP)
	vendor      Qualcomm
	cores       8, the biggest is core 7 (4x Cortex-X1c big + 4x Cortex-A78c little)
	gpu         Adreno 690
	maintainer  the HakiOS developers (README.md)
