# devices/gaokun3/device.conf: what this device repository is. tools/hakios-device.py reads it; docs/porting/repositories.md has
# every word, and the device's page (docs/devices/gaokun3.md) is made from it, so that the status is said in one place.
#
# Huawei MateBook E Go 2023 (gaokun3), Qualcomm SC8280XP / Snapdragon 8cx Gen 3.
# A laptop-class UEFI machine: no fastboot, no Android bootloader, no recovery partition, no serial console — just UEFI.
# References: github.com/right-0903/linux-gaokun (device tree + patches), github.com/vahiru/gaokun-android (Android device tree).

device gaokun3
	title       MateBook E Go 2023
	vendor      Huawei
	soc         sc8280xp
	defconfig   gaokun3_defconfig
	firmware    pull-firmware.sh
	maintainer  the HakiOS developers (README.md)
	status      cpu         partial   4x Cortex-X1c (big) + 4x Cortex-A78c (little), PSCI=SMC, cpufreq=1 (CONFIG_HAKIOS_CPUFREQ): configured and built, the same boot path seen under QEMU only, not yet seen on the machine
	status      gpu         missing   Adreno 690 (fd690 in Linux); no HakiOS Adreno port for SC8280XP yet (gpu=1)
	status      storage     missing   NVMe SSD over PCIe (Linux works); no HakiOS UFS/NVMe driver for SC8280XP yet (ufs=1)
	status      display     missing   simple-framebuffer via UEFI GOP (0xC6200000, 1600x2560); no GOP framebuffer driver yet (display=1)
	status      touch       missing   Goodix/FocalTech over SPI (Linux panel-hx83121a); no HakiOS touch driver yet (touchscreen=1)
	status      buttons     missing   power/volume via PMIC SPMI; no HakiOS buttons driver yet (buttons=1)
	status      audio       missing   WCD9380 codec + audio DSP; no HakiOS ADSP/sound driver yet (adsp=1 sound=4)
	status      battery     missing   Huawei gaokun3-EC battery; no HakiOS battery driver yet (battery=1)
	status      haptic      missing   no haptics driver ported (haptic=5)
	status      camera      missing   no camera driver ported (cam=5)
	status      torch       missing   no torch driver ported (torch=N)
	status      wifi        missing   WCN6850/ath11k; no HakiOS Wi-Fi driver yet (wifi=1)
	status      bluetooth   missing   no bluetooth driver ported (bt=1)
	status      cellular    missing   no modem driver ported (modem=1)
	status      network     missing   no virtio/net driver needed on real UEFI; none yet (net=1)
	status      thermal     missing   SC8280XP thermal sensors read; no HakiOS thermal driver yet (thermal=1)
	status      usb         missing   no USB driver ported (usb=1)
	status      sensors     missing   no sensor driver ported (sensors=1)
